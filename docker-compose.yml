services:
  # =============================================================
  # 1. FastAPI + Qdrant Backend Service
  # =============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexusrag-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-nexus_rag}
      - JWT_SECRET=${JWT_SECRET:-nexus_rag_super_secret_jwt_key_2026_change_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - backend_qdrant_data:/app/backend/data/qdrant_storage
      - backend_docs_data:/app/backend/data/documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusrag-network

  # =============================================================
  # 2. React 19 + Nginx Frontend Service
  # =============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Build-time API URL pointing to the backend
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: nexusrag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexusrag-network

volumes:
  backend_qdrant_data:
    name: nexusrag_qdrant_data
  backend_docs_data:
    name: nexusrag_docs_data

networks:
  nexusrag-network:
    name: nexusrag_network
    driver: bridge
